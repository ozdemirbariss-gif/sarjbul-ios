disabled_rules:
  - function_parameter_count
  - identifier_name
  - implicit_optional_initialization
  - large_tuple
  - line_length
  - nesting
  - type_body_length

opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional

cyclomatic_complexity:
  warning: 15
  error: 20

file_length:
  warning: 1250
  error: 1400
  ignore_comment_only_lines: true

function_body_length:
  warning: 120
  error: 160

excluded:
  - .build
  - SarjBul/Generated
  - SarjBul/Resources
  - SarjBul.xcodeproj

reporter: xcode
