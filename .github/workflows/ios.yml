name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install backend dependencies
        run: npm ci --ignore-scripts
        working-directory: firebase/functions
      - name: Backend syntax and unit tests
        run: |
          npm run lint
          npm run test:core
        working-directory: firebase/functions
      - name: Test Firebase security rules
        run: npm run test:rules
        working-directory: firebase/functions
      - name: Audit production dependencies
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=moderate
        working-directory: firebase/functions

  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint
      - name: Validate configuration
        run: |
          plutil -lint SarjBul/Resources/Info.plist SarjBul/Resources/PrivacyInfo.xcprivacy SarjBul/Resources/AppConfig.sample.plist
          python3 -m json.tool SarjBul/Resources/design-tokens.json >/dev/null
          python3 -m json.tool database.rules.json >/dev/null
      - name: Validate generated design tokens
        run: |
          python3 Scripts/generate_design_tokens.py
          git diff --exit-code -- \
            SarjBul/Generated/DesignTokens.generated.swift \
            SarjBulWidgets/Generated/DesignTokens.generated.swift
      - name: Core tests
        run: swift test
      - name: EPDK data pipeline tests
        run: python3 -m unittest discover -s Scripts/tests -p 'test_epdk_stations.py' -v
      - name: SwiftLint
        run: swiftlint lint --strict --no-cache
      - name: Generate project
        run: xcodegen generate
      - name: Build app and tests
        run: >-
          xcodebuild -quiet
          -project SarjBul.xcodeproj
          -scheme SarjBul
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Build Release configuration
        run: >-
          xcodebuild -quiet
          -project SarjBul.xcodeproj
          -scheme SarjBul
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
      - name: UI smoke test
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project SarjBul.xcodeproj -scheme SarjBul -derivedDataPath DerivedData -resultBundlePath /tmp/SarjBulTests.xcresult -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO -skip-testing:SarjBulUITests/ReadmeScreenshotTests CODE_SIGNING_ALLOWED=NO test-without-building
      - name: Preserve simulator test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-diagnostics
          path: /tmp/SarjBulTests.xcresult
          retention-days: 3
